<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YachtLabs</title>
  <meta name="description" content="YachtLabs — simple landing page with social links and contact email.">
  <style>
    :root {
      --bg: #0f1115;
      --text: #f4f6f8;
      --muted: rgba(244, 246, 248, 0.82);
      --line: rgba(244, 246, 248, 0.18);
      --hover: rgba(244, 246, 248, 0.1);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      --panel: rgba(7, 10, 14, 0.28);
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-6: 1.5rem;
      --space-8: 2rem;
      --radius-full: 999px;
      --radius-lg: 1.25rem;
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: var(--space-6);
      color: var(--text);
      font-family: var(--font);
      background:
        linear-gradient(rgba(7, 10, 14, 0.45), rgba(7, 10, 14, 0.45)),
        url('./yachtlabs-background.jpg') center center / cover no-repeat,
        var(--bg);
    }

    main {
      width: min(100%, 42rem);
      display: grid;
      justify-items: center;
      gap: var(--space-8);
      text-align: center;
      padding: clamp(1rem, 2vw, 1.5rem);
      border-radius: var(--radius-lg);
      background: var(--panel);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .logo-wrap {
      width: min(78vw, 420px);
    }

    .logo {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(var(--shadow));
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-3);
    }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0.8rem 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-full);
      color: var(--muted);
      text-decoration: none;
      letter-spacing: 0.02em;
      background: rgba(255, 255, 255, 0.04);
      transition: background-color 180ms ease, border-color 180ms ease, color 180ms ease, transform 180ms ease;
    }

    .link:hover,
    .link:focus-visible {
      background: var(--hover);
      border-color: rgba(244, 246, 248, 0.34);
      color: var(--text);
      transform: translateY(-1px);
      outline: none;
    }

    .link:active {
      transform: translateY(0);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      body { padding: var(--space-4); }
      main { gap: var(--space-6); width: 100%; }
      .logo-wrap { width: min(82vw, 320px); }
      .link { width: 100%; }
      nav { width: 100%; }
    }
  </style>
</head>
<body>
  <a class="sr-only" href="#content"></a>
  <main id="content" aria-label="YachtLabs landing page">
    <div class="logo-wrap">
      <img
        class="logo"
        src="./yachtlabs-image.png"
        alt="YachtLabs"
        width="400 "
        height="204"
      >
    </div>

    <nav aria-label="Social and contact links">
      <a class="link" href="https://instagram.com/yachtlabs" target="_blank" rel="noopener noreferrer">Instagram</a>
      <a class="link" href="https://x.com/yachtlabs" target="_blank" rel="noopener noreferrer">X</a>
      <a class="link" href="mailto:ric@yachtlabs.com">ric@yachtlabs.com</a>
    </nav>
  </main>
</body>
</html>
